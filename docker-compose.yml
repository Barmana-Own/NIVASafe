name: nivasafe
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nivasafe}
      MYSQL_USER: ${MYSQL_USER:-nivasafe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    networks: [nivasafe]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nivasafe]

  api:
    build:
      context: .
      dockerfile: deployment/infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5044
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:?Set an URL-encoded MySQL DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      LOCAL_UPLOAD_DIR: /app/uploads
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL in .env}
      SMTP_FROM: ${SMTP_FROM:-NIVASafe <no-reply@example.com>}
      SUBSCRIPTION_PAYMENT_MODE: ${SUBSCRIPTION_PAYMENT_MODE:-external}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-fallback}
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["/bin/sh", "-c", "./node_modules/.bin/prisma migrate deploy && node dist/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5044/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [nivasafe]

  worker:
    build:
      context: .
      dockerfile: deployment/infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set an URL-encoded MySQL DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL in .env}
      SMTP_FROM: ${SMTP_FROM:-NIVASafe <no-reply@example.com>}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-fallback}
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    command: ["node", "dist/worker.js"]
    networks: [nivasafe]

  web:
    build:
      context: .
      dockerfile: deployment/infrastructure/docker/web.Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    networks: [nivasafe]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5043}:80"
    volumes:
      - ./deployment/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    networks: [nivasafe]

volumes:
  mysql_data: {}
  redis_data: {}
  uploads_data: {}
networks:
  nivasafe:
    driver: bridge
