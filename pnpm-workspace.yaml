packages:
  - frontend
  - backend
  - shared/*
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
minimumReleaseAgeExclude:
  - fast-uri@3.1.8 || 4.1.5
  - brace-expansion@1.1.21 || 2.1.7 || 5.0.12
  - fast-jwt@6.3.4
  - '@fastify/busboy@3.2.2'
  - source-map-js@1.2.2
overrides:
  '@fastify/busboy': 3.2.2
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
  deepmerge-ts: 8.0.2
  fast-jwt: 6.3.4
  browserslist: 4.28.8
  'fast-uri@3': 3.1.8
  'fast-uri@4': 4.1.5
  find-my-way: 9.9.0
  'nanoid@3': 3.3.18
  postcss: 8.5.26
  source-map-js: 1.2.2
  uuid: 11.1.1
