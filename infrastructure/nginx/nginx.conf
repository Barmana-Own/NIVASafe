events { worker_connections 1024; }
http {
  upstream api { server api:5044; }
  upstream web { server web:80; }
  client_max_body_size 10m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; }
    location /docs { proxy_pass http://api; }
    location /health { proxy_pass http://api/api/v1/health; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
